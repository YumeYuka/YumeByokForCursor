[package]
name = "yume-byok-for-cursor"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Cursor BYOK helper: force Responses protocol, unlock reasoning effort, switch providers"
license = "MIT"

[[bin]]
name = "ybc"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
aes-gcm = "0.10"
base64 = "0.22"
zeroize = "1.8"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
